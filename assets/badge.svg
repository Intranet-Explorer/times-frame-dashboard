<svg xmlns="http://www.w3.org/2000/svg" width="320" height="34" viewBox="0 0 320 34" role="img" aria-label="built with Claude × Rectangular">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf6b"/>
      <stop offset="0.5" stop-color="#ffab24"/>
      <stop offset="1" stop-color="#c7791a"/>
    </linearGradient>
    <linearGradient id="shine" x1="-0.4" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff6dd" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff6dd" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.4;1" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.4" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="r"><rect x="1" y="1" width="318" height="32" rx="7"/></clipPath>
  </defs>
  <rect x="1" y="1" width="318" height="32" rx="7" fill="url(#amber)" stroke="#8a5212" stroke-width="2"/>
  <g clip-path="url(#r)"><rect x="0" y="0" width="320" height="34" fill="url(#shine)"/></g>
  <circle cx="20" cy="17" r="5.5" fill="#3a2410">
    <animate attributeName="r" values="5.5;6.4;5.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="35" y="22" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#3a2410">built with Claude &#215; Rectangular</text>
</svg>
